<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prompt-funnel · 把话问清楚</title>
    <meta name="description" content="把要发给 AI 的话粘进来，看看它缺什么，补上，再复制走。全部在本机完成。" />
    <style>
      :root {
        --bg: #f6f6f3;
        --panel: #ffffff;
        --ink: #17171a;
        --muted: #6d6d75;
        --faint: #9a9aa2;
        --line: #e5e5df;
        --line-strong: #d3d3cb;
        --accent: #2f6f4f;
        --accent-ink: #ffffff;
        --accent-soft: color-mix(in srgb, var(--accent) 9%, transparent);
        --warn: #8a6212;
        --warn-soft: color-mix(in srgb, var(--warn) 9%, transparent);
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --radius: 12px;
        --radius-sm: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --panel: #1b1b1f;
          --ink: #ecece8;
          --muted: #9c9ca4;
          --faint: #74747c;
          --line: #2a2a30;
          --line-strong: #3a3a42;
          --accent: #7cc39b;
          --accent-ink: #10120f;
          --warn: #d9b062;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13.5px/1.65 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .shell { max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }

      /* ── header ─────────────────────────────────────────── */
      .bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      .brand { font-size: 19px; font-weight: 600; letter-spacing: -0.015em; }
      .brand span { color: var(--faint); font-weight: 400; margin-left: 8px; font-size: 13px; }
      .tag {
        font-size: 11.5px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }

      /* ── step rail ──────────────────────────────────────── */
      .steps { display: flex; gap: 22px; margin: 16px 0 20px; }
      .step { font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; }
      .step b { font-weight: 600; margin-right: 5px; }
      .step.on { color: var(--ink); }
      .step.on b { color: var(--accent); }

      /* ── layout ─────────────────────────────────────────── */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

      .pane {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px;
      }
      .pane-out { position: sticky; top: 20px; }
      @media (max-width: 900px) { .pane-out { position: static; } }

      label.cap {
        display: block;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--faint);
        margin-bottom: 8px;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 118px;
        resize: vertical;
        padding: 12px 13px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        line-height: 1.7;
      }
      textarea:focus, input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ── chips / buttons ────────────────────────────────── */
      .row-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .chip:hover { color: var(--ink); border-color: var(--line-strong); }
      button.ghost {
        font: inherit;
        font-size: 12.5px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button.ghost:hover { border-color: var(--accent); color: var(--accent); }
      button.primary {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
      }
      button.primary.copied { background: transparent; color: var(--accent); }

      /* ── status ─────────────────────────────────────────── */
      .status { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
      .status b { font-weight: 600; color: var(--ink); }
      .status.todo b { color: var(--warn); }
      .status.ok b { color: var(--accent); }
      .ctx-note { margin-top: 8px; font-size: 11.5px; color: var(--faint); }
      .ctx-note code {
        background: var(--accent-soft);
        color: var(--accent);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: var(--mono);
      }

      /* ── secrets ────────────────────────────────────────── */
      .secrets {
        margin-top: 14px;
        border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
        background: var(--warn-soft);
        border-radius: var(--radius-sm);
        padding: 12px 13px;
      }
      .secrets h2 { font-size: 12px; margin: 0 0 8px; color: var(--warn); font-weight: 600; letter-spacing: 0.02em; }
      .secrets ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
      .secrets li { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
      .secrets li button {
        font: inherit; font-size: 11.5px; padding: 3px 9px; border-radius: 6px;
        border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); cursor: pointer;
      }
      .secrets li button:hover { border-color: var(--warn); color: var(--warn); }
      .secrets .foot { margin-top: 8px; font-size: 11px; color: var(--muted); }

      /* ── answers ────────────────────────────────────────── */
      .answers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .answer {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 12px; padding: 3px 5px 3px 10px; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent);
      }
      .answer button {
        border: 0; background: none; color: inherit; cursor: pointer;
        font-size: 14px; line-height: 1; padding: 0 3px; opacity: 0.7;
      }
      .answer button:hover { opacity: 1; }

      /* ── question cards ─────────────────────────────────── */
      .questions { display: grid; gap: 10px; margin-top: 14px; }
      .q {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 13px;
        background: var(--bg);
      }
      .q-title {
        font-size: 13px; font-weight: 500; margin-bottom: 10px;
        display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
      }
      .q-title .multi {
        font-size: 10.5px; font-weight: 400; color: var(--faint);
        border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 7px;
      }
      .q-options { display: flex; flex-wrap: wrap; gap: 6px; }
      .q-options button {
        font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: var(--radius-sm);
        border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); cursor: pointer;
        transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
      }
      .q-options button:hover { border-color: var(--accent); color: var(--accent); }
      .q-options button.on {
        border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500;
      }
      .q-options button.pre { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }
      .q-say { margin-top: 9px; }
      .q-say .say {
        font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px;
        border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); cursor: pointer;
      }
      .q-say .say:hover { color: var(--accent); border-color: var(--accent); }
      .say-row { display: flex; gap: 8px; align-items: center; }
      .say-row input {
        flex: 1; font: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: var(--radius-sm);
        border: 1px solid var(--accent); background: var(--panel); color: var(--ink);
      }
      .say-row button {
        border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 15px; padding: 0 4px;
      }
      .say-row button:hover { color: var(--ink); }
      .q-done { margin-top: 9px; }
      .q-done button {
        font: inherit; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--radius-sm);
        border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
      }
      .q-foot { margin-top: 10px; font-size: 11.5px; color: var(--faint); }

      /* ── seeds ──────────────────────────────────────────── */
      .seeds { display: grid; gap: 8px; margin-top: 14px; }
      .seeds-note { font-size: 11.5px; color: var(--faint); margin: 0; }
      .seed {
        text-align: left; width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
        padding: 11px 13px; background: var(--bg); cursor: pointer; font: inherit; color: var(--ink);
        transition: border-color 0.12s ease;
      }
      .seed:hover { border-color: var(--accent); }
      .seed.on { border-color: var(--accent); background: var(--accent-soft); }
      .seed b { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }
      .seed span { font-size: 12px; color: var(--muted); line-height: 1.6; }

      /* ── output ─────────────────────────────────────────── */
      .out-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .out-head span { font-size: 11.5px; color: var(--faint); letter-spacing: 0.03em; }
      pre#out {
        margin: 0; padding: 16px; border-radius: 10px; border: 1px solid var(--line);
        background: var(--bg); font-family: var(--mono); font-size: 12px; line-height: 1.75;
        white-space: pre-wrap; word-break: break-word; max-height: 62vh; overflow: auto;
        min-height: 120px;
      }
      pre#out:empty::before {
        content: "补全之后，这里是一段能直接发出去的话。";
        color: var(--faint); font-family: var(--sans);
      }

      /* ── advanced ───────────────────────────────────────── */
      details.advanced { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
      details.advanced summary { cursor: pointer; font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; }
      details.advanced summary:hover { color: var(--ink); }
      .adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
      .adv-grid label { display: block; font-size: 11px; color: var(--faint); margin-bottom: 5px; letter-spacing: 0.06em; }
      select {
        font: inherit; font-size: 12.5px; padding: 7px 9px; border-radius: var(--radius-sm);
        border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); width: 100%;
      }
      .axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 16px; margin-top: 16px; font-size: 10.5px; color: var(--faint); }
      .axis-bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
      .axis-bar > i { display: block; height: 100%; background: var(--accent); }
      .spec { margin-top: 14px; }
      .spec pre {
        margin: 0; max-height: 240px; overflow: auto; font-size: 11px; padding: 12px;
        border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg);
        font-family: var(--mono); color: var(--muted);
      }
      .meta { margin-top: 12px; font-size: 11px; color: var(--faint); }

      footer {
        margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
        font-size: 11.5px; color: var(--faint); display: flex; justify-content: space-between; gap: 12px;
      }
      footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line-strong); }
      footer a:hover { color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="brand">prompt-funnel<span>把话问清楚</span></div>
        <div class="tag">全部在本机完成 · 不发请求</div>
      </header>

      <nav class="steps" aria-label="步骤">
        <span class="step on"><b>1</b>写下</span>
        <span class="step"><b>2</b>补全</span>
        <span class="step"><b>3</b>复制</span>
      </nav>

      <main class="grid">
        <section class="pane pane-in">
          <label class="cap" for="input">你要发给 AI 的话</label>
          <textarea id="input" spellcheck="false" placeholder="例如：帮我优化一下这个东西"></textarea>

          <div class="row-chips" id="samples"></div>
          <div class="row-chips"><button class="ghost" id="example">▶ 看个例子（30 秒）</button></div>

          <div id="secrets"></div>
          <div class="status" id="status"></div>
          <div class="row-chips" id="strict-row">
            <button class="chip" id="strict" aria-pressed="false">☐ 要它说实话（严格评审）</button>
          </div>

          <div class="answers" id="answers"></div>
          <div class="questions" id="questions"></div>
          <div class="seeds" id="seeds"></div>

          <details class="advanced">
            <summary>高级</summary>
            <div class="adv-grid">
              <div>
                <label for="template">模板</label>
                <select id="template">
                  <option value="default">通用</option>
                  <option value="code-review">代码评审</option>
                  <option value="debug">排障</option>
                  <option value="data-analysis">数据分析</option>
                  <option value="writing">写作</option>
                  <option value="image-prompt">图像提示词</option>
                  <option value="research">调研</option>
                  <option value="critique">严格评审</option>
                </select>
              </div>
              <div>
                <label for="style">排版</label>
                <select id="style">
                  <option value="chat">一句话（能直接发）</option>
                  <option value="bluf">分节</option>
                  <option value="compact">紧凑</option>
                  <option value="checklist">勾选清单</option>
                </select>
              </div>
            </div>
            <div class="axes" id="axes"></div>
            <div class="spec"><pre id="spec"></pre></div>
            <div class="meta" id="fidelity"></div>
          </details>
        </section>

        <section class="pane pane-out">
          <div class="out-head">
            <span id="count">收束后的版本</span>
            <button class="primary" id="copy">复制</button>
          </div>
          <pre id="out" aria-live="polite"></pre>
        </section>
      </main>

      <footer>
        <span>同一份内核也跑在 CLI、MCP、浏览器扩展里。</span>
        <a href="https://github.com/sanyin/prompt-funnel">源码</a>
      </footer>
    </div>
    <script type="module">
          import { gate } from './dist/gate.js';
          import { analyzeWithRules } from './dist/analyze.js';
          import { renderSpec } from './dist/render.js';
          import { applyTemplate, getTemplate } from './dist/templates.js';
          import { answerQuestion, questionsFor } from './dist/questions.js';
          import { describe as describeSecret, redactOne, scanSecrets } from './dist/redact.js';
          import { seedsFor } from './dist/seeds.js';
          import { splitContext } from './dist/text.js';
    
          const input = document.getElementById('input');
          const statusEl = document.getElementById('status');
          const questionsEl = document.getElementById('questions');
          const answersEl = document.getElementById('answers');
          const out = document.getElementById('out');
          const count = document.getElementById('count');
          const axesEl = document.getElementById('axes');
          const specEl = document.getElementById('spec');
          const fidelityEl = document.getElementById('fidelity');
          const styleSel = document.getElementById('style');
          const templateSel = document.getElementById('template');
    
          /** Chosen answers, keyed by gap id. Re-applied on every keystroke. */
          const answers = new Map();
          /** Every question seen for the current text, so a multi-select card can
           *  stay on screen after its first pick (the gap disappears from the spec). */
          const questionCache = new Map();
          /** Multi questions the user has finished answering. */
          const finalized = new Set();
          /** Which text the cache belongs to: answers must survive re-renders. */
          let cacheText = null;
    
          // Remembered choices are a hint, never an automatic answer: preselecting
          // what someone picked last time would let them forget what they agreed to.
          const MEMORY_KEY = 'prompt-funnel:answers';
          function loadMemory() {
            try {
              return JSON.parse(localStorage.getItem(MEMORY_KEY) ?? '{}');
            } catch {
              return {};
            }
          }
          function remember(id, value) {
            const memory = loadMemory();
            memory[id] = value;
            try {
              localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
            } catch {
              /* private mode: memory is a nicety, not a requirement */
            }
          }
          /** A direction from the hand-written library, if the user picked one. */
          let pickedSeed = null;
          const ASK_FOR_OPTIONS = '先给我三个方向选';
    
          const AXIS_LABEL = {
            goal: '目标',
            deliverable: '交付',
            context: '背景',
            constraints: '约束',
            acceptance: '验收',
            risk: '风险',
          };
    
          const EXAMPLE = '帮我写个爬虫，顺便加个代理池，再做个面板';
    
          const SAMPLES = [
            '帮我优化一下这个东西',
            '帮我写个爬虫，顺便加个代理池，再做个面板',
            '写一篇关于向量数据库的科普文章',
            'make it better',
          ];
    
          const exampleButton = document.getElementById('example');
          exampleButton.addEventListener('click', () => {
            input.value = EXAMPLE;
            answers.clear();
            render();
            document.getElementById('status').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          });
    
          const samplesEl = document.getElementById('samples');
          for (const sample of SAMPLES) {
            const chip = document.createElement('button');
            chip.className = 'chip';
            chip.textContent = sample.length > 18 ? `${sample.slice(0, 18)}…` : sample;
            chip.title = sample;
            chip.addEventListener('click', () => {
              input.value = sample;
              answers.clear();
              render();
            });
            samplesEl.append(chip);
          }
    
          let timer;
          input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(render, 100);
          });
          styleSel.addEventListener('change', render);
          templateSel.addEventListener('change', render);
    
          function escapeHtml(value) {
            return String(value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
          }
    
          /** Rank options by what this request and this person make likely. */
          function rankOptions(question, request, memory) {
            const score = (option) => {
              let value = 0;
              if (request.includes(option)) value += 3;
              if (memory[question.id] === option) value += 2;
              return value;
            };
            return [...question.options]
              .map((option, index) => ({ option, index, score: score(option) }))
              .sort((a, b) => b.score - a.score || a.index - b.index)
              .map((entry) => entry.option);
          }
    
          function answerFor(id) {
            const existing = answers.get(id);
            if (existing !== undefined) return existing;
            const fresh = { values: [] };
            answers.set(id, fresh);
            return fresh;
          }
    
          function renderQuestions(questions) {
            questionsEl.innerHTML = '';
            const memory = loadMemory();
            const request = splitContext(input.value.trim()).request;
    
            for (const question of questions) {
              const current = answerFor(question.id);
              const confirmed = current.values.length > 0 || (current.custom ?? '').trim().length > 0;
              const card = document.createElement('div');
              card.className = 'q';
    
              const options = rankOptions(question, request, memory)
                .map((option) => {
                  const on = current.values.includes(option);
                  const previous = memory[question.id] === option;
                  const cls = on ? ' class="on"' : previous ? ' class="pre" title="上次你选了这个"' : '';
                  return `<button type="button" data-id="${escapeHtml(question.id)}" data-value="${escapeHtml(option)}"${cls} aria-pressed="${on}">${escapeHtml(option)}</button>`;
                })
                .join('');
    
              const custom = current.custom;
              const customUi =
                custom === undefined
                  ? `<button type="button" class="say" data-say="${escapeHtml(question.id)}">✎ 都不是，我自己说…</button>`
                  : `<div class="say-row">
                       <input type="text" data-custom="${escapeHtml(question.id)}" value="${escapeHtml(custom)}" placeholder="用你自己的话说，原样写进提示词" />
                       <button type="button" data-clear="${escapeHtml(question.id)}" title="收回">×</button>
                     </div>`;
    
              card.innerHTML = `
                <div class="q-title">${escapeHtml(question.question)}${question.multi === true ? '<span class="multi">可多选</span>' : ''}</div>
                <div class="q-options">${options}</div>
                <div class="q-say">${customUi}</div>
                ${question.multi === true && confirmed ? `<div class="q-done"><button type="button" data-done="${escapeHtml(question.id)}">就这些 ✓</button></div>` : ''}
                <div class="q-foot">不选的话，会默认「${escapeHtml(question.assumption.text)}」。</div>`;
              questionsEl.append(card);
            }
    
            questionsEl.querySelectorAll('button[data-id]').forEach((button) => {
              button.addEventListener('click', () => {
                const id = button.dataset.id;
                const value = button.dataset.value;
                const question = questions.find((entry) => entry.id === id);
                const current = answerFor(id);
                if (question?.multi === true) {
                  current.values = current.values.includes(value)
                    ? current.values.filter((entry) => entry !== value)
                    : [...current.values, value];
                } else {
                  current.values = current.values[0] === value ? [] : [value];
                }
                current.custom = undefined;
                if (current.values.length === 0) answers.delete(id);
                else remember(id, value);
                render();
              });
            });
    
            questionsEl.querySelectorAll('button[data-say]').forEach((button) => {
              button.addEventListener('click', () => {
                answerFor(button.dataset.say).custom = '';
                render();
                const field = questionsEl.querySelector(`input[data-custom="${button.dataset.say}"]`);
                field?.focus();
              });
            });
    
            questionsEl.querySelectorAll('button[data-clear]').forEach((button) => {
              button.addEventListener('click', () => {
                answers.delete(button.dataset.clear);
                render();
              });
            });
    
            questionsEl.querySelectorAll('button[data-done]').forEach((button) => {
              button.addEventListener('click', () => {
                finalized.add(button.dataset.done);
                render();
              });
            });
    
            questionsEl.querySelectorAll('input[data-custom]').forEach((field) => {
              field.addEventListener('input', () => {
                const id = field.dataset.custom;
                const current = answerFor(id);
                current.custom = field.value;
                // Only the output is recomputed: re-rendering the cards would take
                // the caret away mid-sentence.
                updateOutput();
              });
            });
          }
    
          function renderAnswers(questions) {
            answersEl.innerHTML = '';
            const open = new Set(questions.map((question) => question.id));
            for (const [id, answer] of answers) {
              if (open.has(id)) continue;
              const parts = answer.custom?.trim() ? [{ text: answer.custom.trim(), custom: true }] : answer.values.map((value) => ({ text: value, custom: false }));
              for (const part of parts) {
                if (part.text.length === 0) continue;
                const pill = document.createElement('span');
                pill.className = 'answer';
                pill.innerHTML = `${part.custom ? '✎ ' : ''}${escapeHtml(part.text)}<button title="撤销">×</button>`;
                pill.querySelector('button').addEventListener('click', () => {
                  const current = answers.get(id);
                  if (current === undefined) return;
                  if (part.custom) current.custom = undefined;
                  else current.values = current.values.filter((value) => value !== part.text);
                  if (current.values.length === 0 && (current.custom === undefined || current.custom.trim() === '')) answers.delete(id);
                  render();
                });
                answersEl.append(pill);
              }
            }
          }
    
          /** List what would leak, with a one-click fix per line. Never edits silently. */
          function renderSecrets(findings) {
            const box = document.getElementById('secrets');
            if (findings.length === 0) {
              box.innerHTML = '';
              return;
            }
            const items = findings
              .map(
                (finding, index) =>
                  `<li><span>${escapeHtml(describeSecret(finding.kind))}（${finding.text.length} 字符）</span><button data-index="${index}">打码</button></li>`,
              )
              .join('');
            box.innerHTML = `
              <div class="secrets">
                <h2>⚠ 这段话里有 ${findings.length} 处敏感信息</h2>
                <ul>${items}</ul>
                <div class="foot">发出去就收不回来了。打码只改这一处，其余不动。</div>
              </div>`;
            box.querySelectorAll('button[data-index]').forEach((button) => {
              button.addEventListener('click', () => {
                input.value = redactOne(input.value, Number(button.dataset.index));
                answers.clear();
                render();
              });
            });
          }
    
          /** Offer the hand-written shelf when the user asks for directions. */
          function renderSeeds(text) {
            const box = document.getElementById('seeds');
            if (answers.get('quality') !== ASK_FOR_OPTIONS) {
              pickedSeed = null;
              box.innerHTML = '';
              return;
            }
            const seeds = seedsFor(text);
            box.innerHTML =
              '<p class="seeds-note">或者从方向库里挑一个（手写，不是 AI 生成的；选中才会进提示词）</p>' +
              seeds
                .map(
                  (seed, index) =>
                    `<button class="seed${pickedSeed?.id === seed.id ? ' on' : ''}" data-index="${index}">
                       <b>${escapeHtml(seed.title)}</b>
                       <span>${escapeHtml(seed.why)}</span>
                     </button>`,
                )
                .join('');
            box.querySelectorAll('button[data-index]').forEach((button) => {
              button.addEventListener('click', () => {
                const seed = seeds[Number(button.dataset.index)];
                pickedSeed = pickedSeed?.id === seed.id ? null : seed;
                render();
              });
            });
          }
    
          /** Build the spec from the current text, answers and toggles. */
          function computeSpec() {
            const text = input.value.trim();
            const split = splitContext(text);
            const request = split.separated ? split.request : text;
            const verdict = gate(request);
            let spec = analyzeWithRules(request, verdict);
            if (split.separated) {
              if (split.context.length > 0) spec.context = [{ text: split.context, source: 'user' }];
              spec.meta.source = text;
            }
            for (const [id, answer] of answers) spec = answerQuestion(spec, id, answer);
    
            const chosen = getTemplate(templateSel.value);
            if (chosen.id !== 'default') spec = applyTemplate(spec, chosen);
    
            // A picked direction replaces "ask the model for directions": the user
            // already chose, so the prompt carries the choice instead of a request.
            if (pickedSeed !== null && verdict.decision !== 'pass') {
              spec = {
                ...spec,
                requirements: spec.requirements.filter((item) => !item.text.includes('先给 3 个方向')),
                constraints: [...spec.constraints, { text: `方向参考：${pickedSeed.title}`, source: 'user' }],
              };
            }
            return { text, request, split, verdict, spec };
          }
    
          /** Recompute only the result pane; the question cards stay untouched. */
          function updateOutput() {
            const { text, split, verdict, spec } = computeSpec();
            if (text.length === 0) return;
            const rendered = renderSpec(spec, { style: styleSel.value });
            // A clear request is sent byte-for-byte; showing a compiled version here
            // would contradict the status line right above it.
            out.textContent = verdict.decision === 'pass' ? text : rendered.text.trimEnd();
            count.textContent =
              verdict.decision === 'pass' ? '原样发送 · 未改写' : `收束后 ${rendered.text.length} 字`;
    
            const ctxNote = split.separated
              ? '<div class="ctx-note">已把 <code>---</code> 上面的部分当背景资料：原样带上，不拆成要求。</div>'
              : '';
            const openQuestions = questionsFor(spec);
            const open = openQuestions.length;
            // Typed answers need a pill immediately, without a full card re-render
            // (which would steal the caret).
            renderAnswers(openQuestions);
            if (verdict.decision === 'pass') {
              statusEl.className = 'status ok';
              statusEl.innerHTML = `<b>这句话已经够清楚了</b>，原样发就行，不用改。${ctxNote}`;
            } else if (open > 0) {
              statusEl.className = 'status todo';
              statusEl.innerHTML = `<b>还缺 ${open} 件事</b>。不问的话，模型会替你决定——选一下、自己写，或者直接复制下面的版本。${ctxNote}`;
            } else {
              statusEl.className = 'status ok';
              statusEl.innerHTML = `<b>补齐了</b>。下面这一版可以复制走了。${ctxNote}`;
            }
            specEl.textContent = JSON.stringify(spec, null, 2);
            const errors = rendered.fidelity.issues.filter((issue) => issue.severity === 'error');
            fidelityEl.textContent =
              `保真 ${(rendered.fidelity.retention * 100).toFixed(0)}% · 未溯源 ${rendered.fidelity.unverifiable.length} · ` +
              (errors.length > 0 ? `${errors.length} 个错误` : '校验通过');
          }
    
          function render() {
            const text = input.value.trim();
            answersEl.innerHTML = '';
            questionsEl.innerHTML = '';
    
            if (text.length === 0) {
              statusEl.textContent = '粘一句话进来试试。';
              statusEl.className = 'status';
              document.getElementById('secrets').innerHTML = '';
              out.textContent = '';
              count.textContent = '收束后的版本';
              edgesReset();
              return;
            }
    
            renderSecrets(scanSecrets(text));
            if (cacheText !== text) {
              questionCache.clear();
              finalized.clear();
              cacheText = text;
            }
    
            const { request, verdict, spec } = computeSpec();
            renderSeeds(request);
    
            const open = verdict.decision === 'pass' ? [] : questionsFor(spec);
            for (const question of open) questionCache.set(question.id, question);
            const extra = [...answers.keys()]
              .filter((id) => questionCache.get(id)?.multi === true && !finalized.has(id) && !open.some((q) => q.id === id))
              .map((id) => questionCache.get(id));
            // Keep the original order: a card that jumps to the bottom after the
            // first pick feels like it was dismissed.
            const order = new Map([...questionCache.keys()].map((id, index) => [id, index]));
            const questions = [...open, ...extra].sort(
              (a, b) => (order.get(a.id) ?? 99) - (order.get(b.id) ?? 99),
            );
            renderAnswers(verdict.decision === 'pass' ? [] : questions);
            renderQuestions(questions);
            updateOutput();
    
            axesEl.innerHTML = Object.entries(verdict.axes)
              .map(
                ([key, value]) =>
                  `<div>${AXIS_LABEL[key] ?? key} ${value.toFixed(2)}<div class="axis-bar"><i style="width:${Math.round(value * 100)}%"></i></div></div>`,
              )
              .join('');
          }
    
          function edgesReset() {
            axesEl.innerHTML = '';
            specEl.textContent = '';
            fidelityEl.textContent = '';
          }
    
          // One visible toggle for the thing most people want but never ask for:
          // permission to disagree with them.
          const strictButton = document.getElementById('strict');
          function syncStrict() {
            const on = templateSel.value === 'critique';
            strictButton.textContent = on ? '☑ 要它说实话（严格评审）' : '☐ 要它说实话（严格评审）';
            strictButton.setAttribute('aria-pressed', on ? 'true' : 'false');
          }
          strictButton.addEventListener('click', () => {
            templateSel.value = templateSel.value === 'critique' ? 'default' : 'critique';
            syncStrict();
            render();
          });
          templateSel.addEventListener('change', syncStrict);
          syncStrict();
    
          const copyButton = document.getElementById('copy');
          copyButton.addEventListener('click', async () => {
            const text = out.textContent ?? '';
            if (text.length === 0) return;
            try {
              await navigator.clipboard.writeText(text);
            } catch {
              const range = document.createRange();
              range.selectNodeContents(out);
              const selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
              document.execCommand?.('copy');
            }
            const previous = copyButton.textContent;
            copyButton.textContent = '已复制';
            copyButton.classList.add('copied');
            setTimeout(() => {
              copyButton.textContent = previous;
              copyButton.classList.remove('copied');
            }, 1500);
          });
    
          render();
        </script>
  </body>
</html>
